name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Validate dependency lockfile
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Audit all locked dependencies
        if: ${{ !cancelled() }}
        run: bun --no-env-file audit
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'server/go.mod'
          cache: false
      - run: make code-vuln
        env:
          GOTOOLCHAIN: local
